<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    text-align: center;
}

.container {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    padding: 50px;
    border-radius: 20px;
    width: 90%;
    max-width: 600px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

h1 {
    font-size: 48px;
    margin-bottom: 15px;
}

p {
    font-size: 18px;
    margin-bottom: 30px;
    opacity: 0.9;
}

.countdown {
    display: flex;
    justify-content: space-between;
    margin-bottom: 30px;
}

.time-box {
    background: rgba(255, 255, 255, 0.2);
    padding: 15px;
    border-radius: 10px;
    width: 22%;
}

.time-box h2 {
    font-size: 28px;
}

.time-box span {
    font-size: 14px;
}

input[type="email"] {
    padding: 12px;
    width: 70%;
    border: none;
    border-radius: 5px;
    outline: none;
}

button {
    padding: 12px 20px;
    border: none;
    border-radius: 5px;
    background: #ffffff;
    color: #764ba2;
    font-weight: bold;
    cursor: pointer;
    margin-left: 5px;
}

button:hover {
    opacity: 0.9;
}
</style>
</head>

<body>

<div class="container">
    <h1>🚀 Coming Soon</h1>
    <p>We're working hard to launch something amazing. Stay tuned!</p>

    <div class="countdown">
        <div class="time-box">
            <h2 id="days">00</h2>
            <span>Days</span>
        </div>
        <div class="time-box">
            <h2 id="hours">00</h2>
            <span>Hours</span>
        </div>
        <div class="time-box">
            <h2 id="minutes">00</h2>
            <span>Minutes</span>
        </div>
        <div class="time-box">
            <h2 id="seconds">00</h2>
            <span>Seconds</span>
        </div>
    </div>

    <form>
        <input type="email" placeholder="Enter your email" required>
        <button type="submit">Notify Me</button>
    </form>
</div>

<script>
// Set launch date (Change this date)
const launchDate = new Date("March 30, 2026 00:00:00").getTime();

const countdown = setInterval(function() {
    const now = new Date().getTime();
    const distance = launchDate - now;

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    document.getElementById("days").innerHTML = days;
    document.getElementById("hours").innerHTML = hours;
    document.getElementById("minutes").innerHTML = minutes;
    document.getElementById("seconds").innerHTML = seconds;

    if (distance < 0) {
        clearInterval(countdown);
        document.querySelector(".countdown").innerHTML = "We Are Live!";
    }
}, 1000);
</script>

</body>
</html>
